name: sub2api-dev

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      args:
        GOLANG_IMAGE: ${SUB2API_GO_IMAGE:-golang:1.26.5-alpine}
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - dev.env
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: debug
      RUN_MODE: standard
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      IMAGE_STORAGE_PATH: /app/data/generated-images
      VIDEO_STORAGE_PATH: /app/data/generated-videos
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../backend:/app
      - app_data:/app/data
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5m

  frontend:
    image: ${SUB2API_NODE_IMAGE:-node:24-alpine}
    init: true
    restart: unless-stopped
    working_dir: /app
    environment:
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
      VITE_DEV_PORT: "3000"
      VITE_DEV_PROXY_TARGET: http://backend:8080
      VITE_DEV_USE_POLLING: "true"
      TZ: Asia/Shanghai
    command: >-
      sh -c "corepack enable &&
      corepack prepare pnpm@9.15.9 --activate &&
      pnpm config set store-dir /pnpm/store &&
      pnpm install --frozen-lockfile &&
      pnpm dev --host 0.0.0.0"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ../frontend:/app
      - ../docs:/docs:ro
      - frontend_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3m

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - dev.env
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_DB: sub2api
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    env_file:
      - dev.env
    command: >-
      sh -c 'exec redis-server
      --save 60 1
      --appendonly yes
      --appendfsync everysec
      --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  app_data:
  postgres_data:
  redis_data:
  go_modules:
  go_build_cache:
  frontend_modules:
  pnpm_store:
