# 新正式 VPS 的固定预发布入口，所有路径只转发到隔离 staging。
map $http_upgrade $sub2api_staging_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 185.61.210.32:18080;
    server_name 185.61.210.32;

    client_max_body_size 200m;
    add_header X-Sub2API-Environment staging always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sub2api_staging_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
