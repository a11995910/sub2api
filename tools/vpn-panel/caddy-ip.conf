http://38.47.115.99 {
    handle /.well-known/acme-challenge/* {
        root * /var/lib/sub-vpn-acme
        file_server
    }
    handle {
        redir https://38.47.115.99{uri} permanent
    }
}

https://38.47.115.99 {
    tls /var/lib/sub-vpn-tls/fullchain.pem /var/lib/sub-vpn-tls/privkey.pem
    request_body {
        max_size 65536
    }
    header Strict-Transport-Security "max-age=31536000"
    redir / /vpn/ temporary
    redir /vpn /vpn/ permanent
    handle /vpn/* {
        reverse_proxy 127.0.0.1:18181
    }
    handle {
        respond 404
    }
}
