name: AI Merge Verify

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Temporary AI merge branch to verify
        required: true
        type: string
      commit:
        description: Full commit SHA on the temporary branch
        required: true
        type: string
      ai_run_id:
        description: AstrBot AI merge run identifier
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-merge-verify-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  deployment-scripts:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TARGET_COMMIT: ${{ inputs.commit }}
    steps:
      - name: Checkout AI merge branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Verify exact commit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"

      - name: Check deployment scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: ${{ inputs.branch }}
      TARGET_COMMIT: ${{ inputs.commit }}
      AI_RUN_ID: ${{ inputs.ai_run_id }}
    steps:
      - name: Checkout AI merge branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Verify exact commit and merge rules
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test -f .github/upstream-merge-rules.yml
          if git grep -n -E '^(<<<<<<< .+|=======$|>>>>>>> .+)$'; then
            echo '检测到未解决的冲突标记。' >&2
            exit 1
          fi
          {
            echo "## AI 合并分支验证"
            echo "- branch: `$TARGET_BRANCH`"
            echo "- commit: `$TARGET_COMMIT`"
            echo "- ai_run_id: `$AI_RUN_ID`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version | grep -q 'go1.26.5'

      - name: Backend unit tests
        working-directory: backend
        run: make test-unit

      - name: Backend integration tests
        working-directory: backend
        run: make test-integration

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: make test-frontend

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend
